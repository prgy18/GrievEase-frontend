<header class="site-header">
  <div class="header-container">

    <!-- ─── Logo ──────────────────────────────────────────────── -->
    <div class="header-brand" routerLink="/">
      <div class="logo-icon">
        <i class="fas fa-clipboard-check"></i>
      </div>
      <span class="brand-name">GrievEase</span>
    </div>

    <!-- ─── Nav Links ─────────────────────────────────────────── -->
    <nav class="header-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        Home
      </a>
      <a routerLink="/about" routerLinkActive="active" class="nav-link">
        About Us
      </a>
      <a routerLink="/process" routerLinkActive="active" class="nav-link">
        Process
      </a>
      <a routerLink="/rules" routerLinkActive="active" class="nav-link">
        Rules
      </a>
      <a
        *ngIf="isLoggedIn"
        routerLink="/dashboard"
        routerLinkActive="active"
        class="nav-link"
      >
        Dashboard
      </a>
    </nav>

    <!-- ─── Auth Actions ──────────────────────────────────────── -->
    <div class="header-actions">

      <!-- Logged OUT -->
      <ng-container *ngIf="!isLoggedIn">
        <button class="btn-header btn-login" (click)="navigateToLogin()">
          Login
        </button>
        <button class="btn-header btn-signup" (click)="navigateToSignup()">
          Sign Up
        </button>
      </ng-container>

      <!-- Logged IN -->
      <ng-container *ngIf="isLoggedIn">
        <span class="user-greeting">
          <i class="fas fa-user-circle"></i>
          Welcome, {{ userName }}!
        </span>
        <button class="btn-header btn-dashboard" (click)="navigateToDashboard()">
          <i class="fas fa-tachometer-alt"></i>
          Dashboard
        </button>
        <button class="btn-header btn-logout" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i>
          Logout
        </button>
      </ng-container>

    </div>
  </div>
</header>
